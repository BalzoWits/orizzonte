<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orizzonte</title>
<meta name="description" content="Paesaggi 3D nel browser: terreni, cielo, nuvole e acqua con render fotografico progressivo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182029'/%3E%3Ccircle cx='21' cy='12' r='5' fill='%23f2b45a'/%3E%3Cpath d='M2 26l8-10 5 6 4-4 11 8z' fill='%238fb3c9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="21" cy="12" r="5" fill="#f2b45a"/><path d="M2 26l8-10 5 6 4-4 11 8z" fill="#8fb3c9"/></svg>
    <span>Orizzonte</span>
  </div>
  <div class="status" id="status">Avvio…</div>
  <button id="btnRender" class="primary" type="button">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    Render finale
  </button>
</header>

<main>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="frame" id="frame"></div>
    <div class="busy" id="busy" hidden><span class="spin"></span>Genero il terreno…</div>
    <div class="renderbar" id="renderbar" hidden>
      <div class="rb-track"><div class="rb-fill" id="rb-fill"></div></div>
      <div class="rb-row">
        <span id="rb-text">…</span>
        <span class="rb-actions">
          <button id="btnSave" class="primary" type="button" hidden>Salva PNG</button>
          <button id="btnCancel" class="btn" type="button">Annulla</button>
        </span>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="help">Trascina: ruota · Rotella: zoom · Tasto destro: sposta · Doppio clic: fuoco</div>
  </div>

  <aside class="panel">
    <nav class="tabs" aria-label="Pannelli">
      <button type="button" data-tab="scene"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Scene</button>
      <button type="button" data-tab="terreno"><svg viewBox="0 0 24 24"><path d="M2 20l6-10 4 6 3-4 7 8z"/></svg>Terreno</button>
      <button type="button" data-tab="cielo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Cielo</button>
      <button type="button" data-tab="acqua"><svg viewBox="0 0 24 24"><path d="M2 9c3-3 5 3 8 0s5 3 8 0 4-1 4-1M2 15c3-3 5 3 8 0s5 3 8 0 4-1 4-1"/></svg>Acqua</button>
      <button type="button" data-tab="oggetti"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="5"/><path d="M13 3h8v8h-8z"/></svg>Oggetti</button>
      <button type="button" data-tab="camera"><svg viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Camera</button>
      <button type="button" data-tab="render"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Render</button>
    </nav>
    <div class="tabbody" id="tabbody"></div>
  </aside>
</main>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<div class="fatal" id="fatal" hidden>
  <div>
    <h2>Questo browser non riesce a far girare Orizzonte</h2>
    <p id="fatal-msg"></p>
    <p>Serve un browser recente con WebGL2 (Chrome, Edge o Firefox aggiornati) e l'accelerazione grafica attiva.</p>
  </div>
</div>

<script src="js/terrain.js"></script>
<script src="js/shaders.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
